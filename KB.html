<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фильтр Кабельный ввод</title>
  <style>
    :root {
      --ex-bg: #ffc107;
      --ex-color: #000000;
      --op-bg: #e0e0e0;
      --op-color: #333333;
      --panel-bg: #f8f9fa;
      --border-color: #cccccc;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
    }

    /* --- Окно фильтрации --- */
    .filter-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      max-width: 800px;
      margin-bottom: 20px;
    }

    /* Два поля в один ряд, выровненные по краям */
    .filter-row-two-fields {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .filter-row-two-fields .field-item {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .field-item input, .field-item select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Кнопки исполнения без текста над ними */
    .execution-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-ex {
      background-color: var(--ex-bg);
      color: var(--ex-color);
      border: 1px solid #d39e00;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-op {
      background-color: var(--op-bg);
      color: var(--op-color);
      border: 1px solid #bbb;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Нижняя панель действий фильтра */
    .filter-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      padding-top: 12px;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid #999;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Счетчик позиций (без слов "Показано позиций:") */
    .position-counter {
      font-weight: bold;
      font-size: 16px;
      background: #e9ecef;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* --- Таблица и Адаптивность --- */
    .table-wrapper {
      width: 100%;
      overflow-x: auto; /* Скролл по сторонам на мобильных */
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .cable-gland-table {
      width: 100%;
      min-width: 750px; /* Предотвращает излишнее сжатие в телефоне */
      border-collapse: collapse;
      text-align: left;
    }

    .cable-gland-table th, 
    .cable-gland-table td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      font-size: 14px;
    }

    /* Сужение столбцов 2, 3, 4, 6 */
    .cable-gland-table th:nth-child(2), .cable-gland-table td:nth-child(2),
    .cable-gland-table th:nth-child(3), .cable-gland-table td:nth-child(3),
    .cable-gland-table th:nth-child(4), .cable-gland-table td:nth-child(4),
    .cable-gland-table th:nth-child(6), .cable-gland-table td:nth-child(6) {
      width: 1%;
      white-space: nowrap;
      padding-left: 4px;
      padding-right: 4px;
      text-align: center;
    }

    /* Плашки в таблице */
    .badge-ex {
      background-color: var(--ex-bg);
      color: var(--ex-color);
      border-radius: 4px;
      padding: 3px 8px;
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
    }

    .badge-universal {
      background-color: #000000;
      color: #ffffff;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      cursor: help;
    }

    /* Вкладки типов изделий (демо) */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 12px;
      border: 1px solid #ccc;
      background: #eee;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
  </style>
</head>
<body>

  <!-- Вкладки типов изделий -->
  <div class="tabs">
    <button class="tab-btn active" data-type="gland">Кабельный ввод</button>
    <button class="tab-btn" data-type="adapter">Переходник</button>
    <button class="tab-btn" data-type="plug">Заглушка</button>
  </div>

  <!-- Панель фильтрации -->
  <div class="filter-panel">
    
    <!-- Поля в один ряд (выровнены по краям) -->
    <div class="filter-row-two-fields">
      <div class="field-item">
        <input type="text" id="filter-thread" placeholder="Резьба (например, M20)">
      </div>
      <div class="field-item">
        <input type="text" id="filter-material" placeholder="Материал">
      </div>
    </div>

    <!-- Кнопки исполнения без надписи над ними -->
    <div class="execution-buttons">
      <button type="button" class="btn-ex">Ex-взрывозащ.</button>
      <button type="button" class="btn-op">О-общепром.</button>
    </div>

    <!-- Нижняя панель действий -->
    <div class="filter-actions">
      <button type="button" id="btn-reset" class="btn-reset">Сбросить</button>
      <!-- Только счетчик без слов "Показано позиций:" -->
      <span id="counter" class="position-counter">12</span>
    </div>

  </div>

  <!-- Обертка таблицы с горизонтальным скроллом -->
  <div class="table-wrapper">
    <table class="cable-gland-table">
      <thead>
        <tr>
          <th>№</th>
          <th>Исполнение</th>
          <th>Резьба</th>
          <th>Размер</th>
          <th>Наименование</th>
          <th>Кабель</th>
          <th>Материал</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td><span class="badge-ex">Ex</span></td>
          <td>M20x1.5</td>
          <td>20</td>
          <td>Ввод кабельный ВК-12</td>
          <td><span class="badge-universal" title="У — универсальный, в броне и без">У</span></td>
          <td>Латунь</td>
        </tr>
        <tr>
          <td>2</td>
          <td><span class="badge-ex">Ex</span></td>
          <td>G1/2"</td>
          <td>16</td>
          <td>Ввод кабельный ВК-15</td>
          <td><span class="badge-universal" title="У — универсальный, в броне и без">У</span></td>
          <td>Нержавеющая сталь</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Текущий активный тип изделия
    let currentProductType = 'adapter'; 

    // Логика переключения вкладок типов изделий
    document.querySelectorAll('.tab-btn').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentProductType = e.target.getAttribute('data-type');
      });
    });

    // Кнопка "Сбросить" (сохраняет текущую вкладку Типа изделия)
    document.getElementById('btn-reset').addEventListener('click', () => {
      // 1. Сохраняем состояние вкладки
      const savedType = currentProductType;

      // 2. Очищаем значения полей в текущем фильтре
      document.getElementById('filter-thread').value = '';
      document.getElementById('filter-material').value = '';

      // 3. Восстанавливаем сохраненный тип изделия
      currentProductType = savedType;

      // 4. Обновляем счетчик / результаты
      updateCounter();
    });

    function updateCounter() {
      // Пример динамического обновления только счетчика
      document.getElementById('counter').textContent = '12';
    }
  </script>
</body>
</html>
