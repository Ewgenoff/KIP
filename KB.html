<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтр кабельных вводов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* Шапка фильтра */
        .filter-header {
            background-color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .filter-group input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
            font-size: 14px;
        }

        .btn-ex {
            padding: 9px 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #e0e0e0;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ex.active {
            background-color: #ff9800;
            color: #fff;
            border-color: #e68a00;
        }

        .reset-btn {
            padding: 9px 15px;
            border: 1px solid #d9534f;
            background-color: #fff;
            color: #d9534f;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .reset-btn:hover {
            background-color: #d9534f;
            color: #fff;
        }

        /* Таблица */
        .table-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #888;
            font-style: italic;
        }

        .status-info {
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Фильтр подбора кабельных вводов</h1>

    <!-- Панель фильтрации -->
    <div class="filter-header">
        <div class="filter-group">
            <label for="holeInput">Поле 1 - Посадочное отверстие</label>
            <input type="text" id="holeInput" placeholder="Например: 20">
        </div>

        <div class="filter-group">
            <label for="cableDiameterInput">Поле 2 - Диаметр кабеля</label>
            <input type="text" id="cableDiameterInput" placeholder="Например: 14">
        </div>

        <div class="filter-group">
            <label for="armorInput">Поле 3 - в броне</label>
            <input type="text" id="armorInput" placeholder="Например: 16">
        </div>

        <div class="filter-group">
            <label for="mrInput">Поле 4 - в МР</label>
            <input type="text" id="mrInput" placeholder="Значение МР">
        </div>

        <button type="button" id="exBtn" class="btn-ex">Ex</button>
        <button type="button" id="resetBtn" class="reset-btn">Сбросить фильтры</button>
    </div>

    <div class="status-info" id="statusInfo">Загрузка данных...</div>

    <!-- Таблица результатов -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Производитель</th>
                    <th>Наличие взрывозащиты</th>
                    <th>Наличие брони</th>
                    <th>Размер МР</th>
                    <th>Наименование</th>
                    <th>Код УПП</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="no-data">Загрузка данных из таблицы...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzAETiIKfUBvchm03dtQKognrImGtEbT5O13_WQpCe7exHxLvPXOAAqFdm9899nSeF3gVvkrTsTcej/pub?output=csv';

        let rawData = [];
        let isExActive = false;

        // Элементы DOM
        const holeInput = document.getElementById('holeInput');
        const cableDiameterInput = document.getElementById('cableDiameterInput');
        const armorInput = document.getElementById('armorInput');
        const mrInput = document.getElementById('mrInput');
        const exBtn = document.getElementById('exBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tableBody = document.getElementById('tableBody');
        const statusInfo = document.getElementById('statusInfo');

        // Парсер CSV
        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length === 0) return [];

            const result = [];
            const headers = parseCSVLine(lines[0]);

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header.trim()] = row[index] ? row[index].trim() : '';
                });
                result.push(obj);
            }
            return result;
        }

        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current);
            return values.map(v => v.replace(/^"|"$/g, '').trim());
        }

        // Загрузка данных
        async function loadData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                const allData = parseCSV(csvText);

                // Фильтр по назначению Function ("Каб. ввод" или "Каб. ввод под МР")
                rawData = allData.filter(item => {
                    const func = (item['Function'] || '').toLowerCase();
                    return func === 'каб. ввод' || func === 'каб. ввод под мр';
                });

                statusInfo.textContent = `Загружено записей: ${rawData.length}`;
                applyFilters();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                statusInfo.textContent = 'Ошибка загрузки данных из таблицы.';
                tableBody.innerHTML = '<tr><td colspan="6" class="no-data">Не удалось загрузить данные</td></tr>';
            }
        }

        // Вспомогательные функции парсинга и проверки условий
        function extractSizeNumber(str) {
            if (!str) return null;
            const match = str.match(/M(\d+)/i);
            return match ? parseFloat(match[1]) : null;
        }

        function isNumberInRange(valStr, targetNum) {
            if (!valStr || isNaN(targetNum)) return false;
            
            // Нормализация разделителей
            const cleanStr = valStr.replace(',', '.');
            const match = cleanStr.match(/([\d.]+)\s*[-—–]\s*([\d.]+)/);

            if (match) {
                const min = parseFloat(match[1]);
                const max = parseFloat(match[2]);
                return targetNum >= min && targetNum <= max;
            } else {
                // Если указано точное число
                const singleNum = parseFloat(cleanStr);
                return !isNaN(singleNum) && singleNum === targetNum;
            }
        }

        // Применение всех фильтров
        function applyFilters() {
            const holeVal = parseFloat(holeInput.value.replace(',', '.'));
            const cableVal = parseFloat(cableDiameterInput.value.replace(',', '.'));
            const armorVal = parseFloat(armorInput.value.replace(',', '.'));
            const mrVal = mrInput.value.trim().toLowerCase();

            const filtered = rawData.filter(item => {
                // 1. Посадочное отверстие
                if (!isNaN(holeVal)) {
                    const itemHoleNum = extractSizeNumber(item['Size/thread']);
                    if (itemHoleNum === null || itemHoleNum !== holeVal) return false;
                }

                // 2. Диаметр кабеля
                if (!isNaN(cableVal)) {
                    if (!isNumberInRange(item['Diameter without armor Dк'], cableVal)) return false;
                }

                // 3. В броне
                if (!isNaN(armorVal)) {
                    if (!isNumberInRange(item['Outer diameter Dkb'], armorVal)) return false;
                }

                // 4. В МР
                if (mrVal !== '') {
                    const itemMR = (item['MR'] || '').toLowerCase();
                    if (!itemMR.includes(mrVal)) return false;
                }

                // 5. Кнопка Ex
                if (isExActive) {
                    const exVal = (item['Ex'] || '').toLowerCase();
                    if (!exVal.includes('ex')) return false;
                }

                return true;
            });

            renderTable(filtered);
        }

        // Отрисовка таблицы
        function renderTable(data) {
            statusInfo.textContent = `Отображено записей: ${data.length} из ${rawData.length}`;

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="no-data">Ничего не найдено по заданным критериям</td></tr>';
                return;
            }

            const html = data.map(item => `
                <tr>
                    <td>${item['Manufacturer'] || '-'}</td>
                    <td>${item['Explosion protection'] || '-'}</td>
                    <td>${item['Cable'] || '-'}</td>
                    <td>${item['MR'] || '-'}</td>
                    <td>${item['ProjectName'] || '-'}</td>
                    <td>${item['PartNumber'] || '-'}</td>
                </tr>
            `).join('');

            tableBody.innerHTML = html;
        }

        // События ввода и нажатий
        [holeInput, cableDiameterInput, armorInput, mrInput].forEach(input => {
            input.addEventListener('input', applyFilters);
        });

        exBtn.addEventListener('click', () => {
            isExActive = !isExActive;
            exBtn.classList.toggle('active', isExActive);
            applyFilters();
        });

        resetBtn.addEventListener('click', () => {
            holeInput.value = '';
            cableDiameterInput.value = '';
            armorInput.value = '';
            mrInput.value = '';
            isExActive = false;
            exBtn.classList.remove('active');
            applyFilters();
        });

        // Инициализация
        loadData();
    </script>
</body>
</html>
